<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header-head}"></head>
<body>
<div th:replace="~{fragments/header :: header-banner}"></div>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card gov-card shadow-sm border-0">
                <div class="card-header gov-card-header bg-navy text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="fa-solid fa-user-gear me-2 text-warning"></i> Beneficiary Profile Credentials</h4>
                </div>
                <div class="card-body p-4">
                    <table class="table table-bordered align-middle">
                        <tr><th class="bg-light w-35">Full Name</th><td class="fw-bold text-navy" th:text="${beneficiary.user.fullName}">Hari Pabbuleti</td></tr>
                        <tr><th class="bg-light">Gmail Address</th><td th:text="${beneficiary.user.email}">hari.pabbu@gmail.com</td></tr>
                        <tr><th class="bg-light">Mobile Number</th><td th:text="'+91 ' + ${beneficiary.user.mobileNumber}">+91 9988776655</td></tr>
                        <tr><th class="bg-light">Age / Gender</th><td th:text="${beneficiary.age} + ' Years | ' + ${beneficiary.gender}">28 Years | Male</td></tr>
                        <tr><th class="bg-light">Social Category</th><td th:text="${beneficiary.category}">OBC</td></tr>
                        <tr><th class="bg-light">State / District</th><td th:text="${beneficiary.state} + ' - ' + ${beneficiary.district}">Andhra Pradesh - Kakinada</td></tr>
                        <tr><th class="bg-light">Address</th><td th:text="${beneficiary.address} + ' (Pincode: ' + ${beneficiary.pincode} + ')'">12/4 Gandhi Nagar</td></tr>
                        <tr><th class="bg-light">Identity Document</th><td th:text="${beneficiary.identityType} + ': ' + ${beneficiary.identityNumber}">Aadhaar: 123456789012</td></tr>
                        <tr><th class="bg-light">Verification Status</th><td><span class="badge bg-success" th:text="${beneficiary.identityStatus}">VERIFIED</span></td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
