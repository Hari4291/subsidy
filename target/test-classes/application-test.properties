# =========================================================
# TEST PROFILE — uses H2 in-memory database
# Does NOT touch production MySQL
# =========================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Disable DevTools in tests
spring.devtools.restart.enabled=false

# Thymeleaf
spring.thymeleaf.cache=false

# OTP settings (shortened for test speed)
otp.expiry.minutes=5
otp.max.attempts=5
otp.resend.cooldown.seconds=60

# Mail — will be mocked via @MockBean in tests
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Suppress Hibernate SQL noise in tests
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
logging.level.org.springframework.security=WARN
logging.level.com.example.digital_subsidy=WARN
