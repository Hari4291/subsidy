<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header-head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' - Digital Subsidy Portal' : 'Digital Subsidy & Grant Administration Portal'}">Digital Subsidy & Grant Administration Portal</title>
    <!-- Bootstrap 5 CSS & JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/favicon-512x512.png}">
    <link rel="icon" type="image/png" sizes="256x256" th:href="@{/favicon-256x256.png}">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/favicon-16x16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/apple-touch-icon.png}">
    <!-- Custom Government Styling -->
    <link rel="stylesheet" th:href="@{/css/gov-style.css}">
</head>
<body>
<div th:fragment="header-banner">
    <!-- Top Utility Bar -->
    <div class="top-bar">
        <div class="container d-flex justify-content-between align-items-center">
            <div>
                <span class="me-3"><i class="fa-solid fa-flag"></i> Government of India | Official Portal</span>
                <a href="#main-content" class="text-decoration-none text-light me-2">Skip to Main Content</a>
            </div>
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-sm btn-outline-light py-0 px-2" onclick="document.body.classList.toggle('high-contrast')">High Contrast</button>
                <a th:href="@{/help}" class="me-2"><i class="fa-solid fa-headset me-1"></i> Helpdesk</a>
                <a th:href="@{/schemes}" class="me-2"><i class="fa-solid fa-sitemap me-1"></i> Schemes</a>
            </div>
        </div>
    </div>

    <!-- Main Header -->
    <header class="gov-header py-3">
        <div class="container d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
                <!-- Emblem Placeholder SVG -->
                <svg class="gov-emblem" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="46" stroke="#d97706" stroke-width="4" fill="#0f2b48"/>
                    <path d="M50 15L60 38H40L50 15Z" fill="#d97706"/>
                    <rect x="35" y="42" width="30" height="28" rx="2" fill="#ffffff"/>
                    <path d="M30 75H70V82H30V75Z" fill="#d97706"/>
                    <circle cx="50" cy="56" r="6" fill="#0f2b48"/>
                </svg>
                <div>
                    <h1 class="portal-title">Digital Subsidy &amp; Grant Administration Portal</h1>
                    <p class="portal-sub">Ministry of Public Welfare &amp; Financial Assistance Administration</p>
                </div>
            </div>
            <div class="d-none d-md-block text-end">
                <span class="badge bg-warning text-dark me-2">Portal Status: ONLINE</span>
                <span class="text-light small"><i class="fa-solid fa-shield-halved me-1"></i> Secure 256-Bit SSL Encrypted</span>
            </div>
        </div>
    </header>
</div>
</body>
</html>
