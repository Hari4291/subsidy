<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="admin-header" class="p-3 bg-navy text-white rounded mb-4 shadow-sm">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div>
            <h4 class="mb-1 fw-bold"><i class="fa-solid fa-user-shield text-warning me-2"></i> Digital Subsidy &amp; Grant Administration</h4>
            <p class="mb-0 text-light small">Portal System Governance &amp; Administration Console</p>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
            <a th:href="@{/admin/officers}" class="btn btn-outline-light fw-bold"><i class="fa-solid fa-user-gear me-1"></i> Users &amp; Roles</a>
            <a th:href="@{/admin/beneficiaries}" class="btn btn-outline-light fw-bold"><i class="fa-solid fa-users me-1"></i> Beneficiaries</a>
            <a th:href="@{/admin/schemes}" class="btn btn-outline-light fw-bold"><i class="fa-solid fa-layer-group me-1"></i> Schemes</a>
            <a th:href="@{/admin/reports}" class="btn btn-outline-light fw-bold"><i class="fa-solid fa-chart-pie me-1"></i> Reports &amp; Budgets</a>
            <a th:href="@{/admin/audit-logs}" class="btn btn-outline-light fw-bold"><i class="fa-solid fa-list-check me-1"></i> Audit Logs</a>
            <form th:action="@{/logout}" method="post" class="d-inline ms-1">
                <button type="submit" class="btn btn-danger fw-bold"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
