# =========================================================
# APPLICATION
# =========================================================

spring.application.name=digital_subsidy
server.port=8080


# =========================================================
# MYSQL DATABASE
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/digitalsubsidy
spring.datasource.username=root
spring.datasource.password=Hari@4291
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Recommended for clean Controller -> Service -> Repository architecture
spring.jpa.open-in-view=false


# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework.security=INFO
logging.level.com.example.digital_subsidy=DEBUG


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never


# =========================================================
# CHARACTER ENCODING
# =========================================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


# =========================================================
# SPRING MAIL / SMTP (Gmail)
# SMTP credentials are read from environment variables.
# Set MAIL_USERNAME and MAIL_PASSWORD before starting.
# =========================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:pabbuletihari@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xjoowyzwamzhmhyq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# =========================================================
# OTP SETTINGS
# =========================================================

# OTP validity in minutes
otp.expiry.minutes=5

# Maximum failed verification attempts before OTP is invalidated
otp.max.attempts=5

# Minimum seconds between resend requests
otp.resend.cooldown.seconds=60